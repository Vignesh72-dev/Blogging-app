<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Blogging App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; height: 100vh; align-items: center; justify-content: center; }
        .box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); width: 300px; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        h2 { text-align: center; }
        .error { color: #c0392b; text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <h2>Blogging App</h2>
    <p class="error" th:if="${param.error}">Invalid username or password.</p>
    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" required/>
        <label>Password</label>
        <input type="password" name="password" required/>
        <button type="submit">Log In</button>
    </form>
</div>
</body>
</html>
