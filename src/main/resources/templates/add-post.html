<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Post</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { padding: 10px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        a { display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
<h1>New Post</h1>
<form th:action="@{/posts}" th:object="${post}" method="post">
    <label>Title</label>
    <input type="text" th:field="*{title}" required/>
    <label>Author</label>
    <input type="text" th:field="*{author}" required/>
    <label>Content</label>
    <textarea th:field="*{content}" rows="6" required></textarea>
    <button type="submit">Publish</button>
</form>
<a th:href="@{/}">&larr; Back to posts</a>
</body>
</html>
